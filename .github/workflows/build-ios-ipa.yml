name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build IPA
    runs-on: macos-15

    env:
      PROJECT_PATH: SmartGradeScanner.xcodeproj
      SCHEME: SmartGradeScanner
      ARCHIVE_PATH: build/SmartGradeScanner.xcarchive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          set -euo pipefail

          APP_PATH="$ARCHIVE_PATH/Products/Applications/SmartGradeScanner.app"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -qry SmartGradeScanner.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-IPA
          path: SmartGradeScanner.ipa
